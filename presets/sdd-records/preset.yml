schema_version: "1.0"

preset:
  id: "sdd-records"
  name: "SDD Records"
  version: "1.3.0"
  description: "Plans name the design docs they read and the decisions that need an ADR; task lists always include tests and end with design-doc, agent-guidance, ADR, verify and finalize tasks"
  author: "orchestral-labs"
  repository: "https://github.com/lradomski10m/speckit-repo-kit"
  license: "Proprietary"

requires:
  speckit_version: ">=1.1.0"

provides:
  templates:
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan with Design context, Significant decisions and a per-principle constitution check"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks with required tests and the closing records tasks"
      replaces: "tasks-template"

tags:
  - "records"
  - "design-docs"
  - "adr"
